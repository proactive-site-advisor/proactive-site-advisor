name: Testing

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    unit-tests:
        name: Unit Tests (PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.5', '8.4','8.3', '8.2', '8.1', '8.0', '7.4' ]

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    tools: composer:v2

            -   name: Install dependencies
                run: composer install --no-interaction --prefer-dist --no-progress

            -   name: Run unit tests
                run: composer test:unit

    integration-tests:
        name: Integration Tests (PHP ${{ matrix.php-version }})
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-version: [ '8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4' ]

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: proactive_site_advisor_test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-version }}
                    tools: composer:v2
                    extensions: mysqli, mbstring

            -   name: Install dependencies
                run: composer install --no-interaction --prefer-dist --no-progress

            -   name: Setup WordPress test environment
                run: |
                    bash bin/install-wp-tests.sh \
                        proactive_site_advisor_test \
                        root \
                        root \
                        127.0.0.1:3306 \
                        6.1

            -   name: Run integration tests
                run: composer test:integration
